server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: send unknown routes to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html 必须每次回源校验。
  # 它没带 Cache-Control 时浏览器会按 Last-Modified 自己启发式缓存，
  # 手机上尤其明显 —— 缓存住的旧 index 指向旧的 hash 资源，而那些资源
  # 又是 immutable 一年，于是发了新版也一直看到旧界面。
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # long-cache hashed assets（文件名带 hash，内容变了名字就变）
  location ~* \.(js|css|woff2?|png|jpg|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
