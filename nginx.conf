server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: send unknown routes to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html 必须每次回源校验。
  # 它没带 Cache-Control 时浏览器会按 Last-Modified 自己启发式缓存，
  # 手机上尤其明显 —— 缓存住的旧 index 指向旧的 hash 资源，而那些资源
  # 又是 immutable 一年，于是发了新版也一直看到旧界面。
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # 只有 assets/ 里的文件名带 hash，内容一变文件名就变，才能放心长缓存。
  # ^~ 让它优先于下面那条正则，否则 assets 里的图片会被当成普通图片。
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 根目录的图片（logo / mascot / favicon）文件名是固定的。
  # 之前这些也被打上 immutable 一年，换了图老用户一年都刷不到新的。
  location ~* \.(png|jpe?g|svg|ico|webp|woff2?)$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
